name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Source and staleness gates
        run: npm run check

      - name: Parser tests
        run: npm test

      - name: Build pages
        run: npm run build

      - name: Voice and prose lint
        run: npm run lint
